name: Setup Lean (Kimchi formalization)
description: >
  elan (pinned toolchain) + Mathlib olean cloud cache + a restore of the build-directory
  cache for the libraries, then a `lake build` of the requested targets. Restore-only:
  the Lean workflow's build job saves the cache explicitly (even on a failing run, so
  red iterations stay incremental); every other consumer — the parallel gate jobs and
  the witness-check job in the CI workflow — restores what that job saved.
inputs:
  targets:
    description: >-
      Space-separated lake targets to build (from `formal/`, the aggregator workspace).
    required: false
    default: >-
      Kimchi Snarky Pasta Poseidon FixtureKit Bulletproof BulletproofFixture
      KimchiFixture
outputs:
  cache-key:
    description: The primary key of the build-directory cache (for an explicit save).
    value: ${{ steps.restore.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Install elan (reads the pinned toolchain from lean-toolchain)
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
          | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    # Restore the project's own build directory (Mathlib oleans come from
    # `lake exe cache get` below, not from here). `restore-keys` lets a run whose
    # `formal/` sources changed start from the previous build and recompile
    # incrementally instead of from scratch.
    - name: Restore the Kimchi build directory
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          formal/.lake/build
          formal/*/.lake/build
          formal/vendor/*/.lake/build
          formal/.lake/packages/*/.lake/build/**/*.c.o*
        key: lean-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.toml') }}-${{ hashFiles('formal/**/*.lean') }}
        restore-keys: |
          lean-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.toml') }}-

    - name: Fetch deps + build the requested targets
      shell: bash
      working-directory: formal
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        # Restore dependencies FROM THE COMMITTED MANIFEST (`lake-manifest.json`), so CI
        # builds the pinned revisions rather than whatever `lake update` resolves at run
        # time — the external audit's §2.1 observation that `lake update mathlib` made the
        # dependency set a moving target. If the manifest and lakefile.toml genuinely
        # disagree, that is a repo-state error and should fail here rather than be
        # silently re-resolved; the fallback re-resolves and SAYS SO, so the drift is
        # visible in the log instead of invisible.
        # (Mathlib olean cache; does NOT include ProofWidgets' widget JS.)
        if ! lake exe cache get 2>/dev/null; then
          echo "::warning::committed lake-manifest.json did not satisfy the cache; re-resolving mathlib -- this run is NOT on the committed dependency pin"
          lake update mathlib
          lake exe cache get
        fi
        # Older ProofWidgets tags ship prebuilt widget JS in a GitHub release
        # asset (`ProofWidgets4.tar.gz`) that `lake exe cache get` does not
        # fetch. Newer tags vendor this differently and may not publish the
        # tarball, so treat the download as best-effort.
        pw=.lake/packages/proofwidgets
        rev=$(jq -r '.packages[] | select(.name=="proofwidgets") | .inputRev' lake-manifest.json)
        url="https://github.com/leanprover-community/ProofWidgets4/releases/download/${rev}/ProofWidgets4.tar.gz"
        echo "Checking ProofWidgets cloud release $rev for prebuilt widget JS"
        mkdir -p "$pw/.lake/build"
        if curl -fsI "$url" >/dev/null; then
          echo "Fetching ProofWidgets cloud release asset"
          curl -fsSL "$url" | tar xz -C "$pw/.lake/build"
        else
          echo "No ProofWidgets release tarball for $rev; continuing"
        fi
        # Build the requested targets: the library list typechecks every proof and runs
        # the `#eval`s; the Lean workflow's build job also passes the compiled fixture
        # drivers so the gate job finds their binaries in the restored cache.
        lake build ${{ inputs.targets }}
