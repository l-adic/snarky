name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual "Run workflow" button: build + deploy ANY branch to GitHub Pages
  # without merging to main first (e.g. to preview a feature branch). The
  # heavy test suite is skipped on this path; only the Pages build gates the
  # deploy. NOTE: the button only appears once this workflow_dispatch trigger
  # is present on the DEFAULT branch (main) — GitHub reads dispatchability from
  # there — but the run executes the workflow file of the branch you select.
  workflow_dispatch:

# Pages deploy needs these; test jobs only read. Set workflow-wide to
# match the proven deploy config (slightly over-privileged for the test
# jobs, but avoids Pages-permission breakage).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---- parallel test jobs (no `needs:` => run concurrently) ----------

  format-check:
    # Skipped on a manual Pages preview (workflow_dispatch); gates push/PR only.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: npm install

    - name: Check PureScript formatting
      run: npx purs-tidy check "packages/**/*.purs"

    - name: Check Rust formatting
      run: cargo fmt --all --check

    - name: Run Rust clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

  test-libs:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest-large]
    runs-on: ${{ matrix.os }}
    # Point the on-disk Lagrange-basis cache at a repo-root dir that actions/cache
    # persists across runs (below). Absolute so spawned worker threads write the
    # same dir regardless of cwd.
    env:
      SNARK_LAGRANGE_CACHE_DIR: ${{ github.workspace }}/lagrange-cache
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
          packages/kimchi-napi/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

    - name: Cache SRS files
      uses: actions/cache@v3
      with:
        path: srs-cache/
        key: ${{ runner.os }}-srs-${{ hashFiles('mina/src/lib/crypto/proof-systems/srs/*.srs') }}

    # The Lagrange bases (the expensive FFTs) are deterministic — the same every
    # run — so a STATIC key suffices: populate once, inject thereafter. No need
    # to encode the crypto version in the key, because the cache is already
    # self-validating: each filename carries an SRS fingerprint (blake2b of the
    # generators), so if the crypto ever changes the bytes the fingerprint
    # changes too and old entries simply miss — never served wrong. Keyed
    # per-job (github.job) since test-libs and test-example warm different domain
    # sets and would otherwise fight over one key.
    - name: Cache Lagrange bases
      uses: actions/cache@v3
      with:
        path: lagrange-cache/
        key: ${{ runner.os }}-lagrange-${{ github.job }}

    - name: Install dependencies
      run: npm install

    - name: Populate SRS cache
      run: make fetch-srs

    # The pickles prove tests also write the theorems' dump of every tag they compile
    # (`<app>/<tag>.json`: comparison circuits; `shapes/<tag>.json`: reconstruction inputs).
    - name: Test all libraries (excludes pickles-circuit-diffs)
      run: make test-libs
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"
        PICKLES_DUMP_DIR: ${{ github.workspace }}/pickles-dumps

    # Run-scoped transport to the `check-tags` job, as for the comparison dumps: the checker
    # only ever sees the dumps its own commit's prove tests wrote.
    - name: Upload the tag dumps for the Lean checker
      uses: actions/upload-artifact@v4
      with:
        name: pickles-tag-dumps
        path: pickles-dumps/
        retention-days: 1

  test-example:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest-large]
    runs-on: ${{ matrix.os }}
    # Point the on-disk Lagrange-basis cache at a repo-root dir that actions/cache
    # persists across runs (below). Absolute so spawned worker threads write the
    # same dir regardless of cwd.
    env:
      SNARK_LAGRANGE_CACHE_DIR: ${{ github.workspace }}/lagrange-cache
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
          packages/kimchi-napi/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

    - name: Cache SRS files
      uses: actions/cache@v3
      with:
        path: srs-cache/
        key: ${{ runner.os }}-srs-${{ hashFiles('mina/src/lib/crypto/proof-systems/srs/*.srs') }}

    # See test-libs: deterministic bases, static per-job key; the fingerprinted
    # filenames make it self-validating. Written here by the `run_simulation`
    # terminal worker (fsLagrangeCache); persisted across runs.
    - name: Cache Lagrange bases
      uses: actions/cache@v3
      with:
        path: lagrange-cache/
        key: ${{ runner.os }}-lagrange-${{ github.job }}

    - name: Install dependencies
      run: npm install

    - name: Populate SRS cache
      run: make fetch-srs

    - name: Generate linearization code
      run: make gen-linearization

    - name: Test example package
      run: make test-example
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"

    - name: Export the transaction application fixtures
      run: npm exec -- spago run -p example-fixtures
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"
        PICKLES_DUMP_DIR: ${{ github.workspace }}/pickles-dumps
        PICKLES_PROOF_CACHE_DIR: ${{ github.workspace }}/packages/example/bin/fixtures/proof-cache

    - name: Upload the transaction circuit and application fixtures
      uses: actions/upload-artifact@v4
      with:
        name: example-tag-dumps
        path: pickles-dumps/
        if-no-files-found: error
        retention-days: 1

    - name: Upload the transaction proof cache
      uses: actions/upload-artifact@v4
      with:
        name: example-proof-cache
        path: packages/example/bin/fixtures/proof-cache/
        if-no-files-found: error
        retention-days: 1

    # Runs only if the example tests passed (a failed step aborts the job).
    # Full one-block pipeline on the purs-backend-es optimized output:
    # circuit compile, genesis, 4 base proofs + 3 merges, root verification.
    - name: Run example simulation
      run: tools/run_simulation.sh
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"

  test-circuit-diffs:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
          packages/kimchi-napi/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

    - name: Cache SRS files
      uses: actions/cache@v3
      with:
        path: srs-cache/
        key: ${{ runner.os }}-srs-${{ hashFiles('mina/src/lib/crypto/proof-systems/srs/*.srs') }}

    - name: Install dependencies
      run: npm install

    - name: Populate SRS cache
      run: make fetch-srs

    - name: Unpack circuit-diff fixtures
      run: make fixtures-unpack

    - name: Test pickles-circuit-diffs
      run: make test-pickles-circuit-diffs
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"

    # Run-scoped transport to the `check-cs` job — the checker can only ever see the
    # dumps its own commit generated. A dump carries the constants its circuit was compiled
    # with (SRS points, keys) that Lean cannot compute.
    - name: Upload the comparison dumps for the Lean checker
      uses: actions/upload-artifact@v4
      with:
        name: circuit-diff-results
        path: packages/pickles-circuit-diffs/circuits/results/*.json
        retention-days: 1

    # The visualizer bundles circuits/results/ into its dist (deployed to Pages);
    # the witness columns are checker input, not visualizer content — strip them.
    - name: Strip witnesses before the visualizer bundles results
      run: |
        for f in packages/pickles-circuit-diffs/circuits/results/*.json; do
          jq 'del(.purescript.witness)' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
        done

    - name: Build circuit diff visualizer
      run: |
        cd packages/pickles-circuit-diffs/visualizer
        npm install
        npm run build
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"
        PUBLIC_URL: /snarky/

    - name: Verify visualizer build output
      run: |
        test -f packages/pickles-circuit-diffs/visualizer/dist/index.html
        test -f packages/pickles-circuit-diffs/visualizer/dist/results/manifest.jsonl
        echo "Visualizer build verified: $(ls packages/pickles-circuit-diffs/visualizer/dist/*.js | wc -l) JS bundle(s), $(ls packages/pickles-circuit-diffs/visualizer/dist/*.css | wc -l) CSS bundle(s), $(ls packages/pickles-circuit-diffs/visualizer/dist/results/*.json | wc -l) circuit result(s)"

  # ---- build the fixture-dump crate (bit-rot guard) -------------------
  # tools/fixture-dump records the Lean formalization's fixtures from
  # proof-systems (formal/ is checked against them). It path-depends on the mina
  # submodule and pins its OWN toolchain (1.92, via tools/fixture-dump/rust-toolchain.toml)
  # — newer than the snarky root's 1.88 — and is kept OUT of the root cargo
  # workspace. Nothing else in CI compiles it, so build it here to catch a
  # proof-systems API drift before a regeneration needs it. BUILD ONLY: running the
  # dumpers needs the SRS files and is slow (that happens on a proof-systems bump,
  # by hand, per the crate README).
  build-fixture-dump:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # The crate's rust-toolchain.toml pins 1.92; install exactly that (the repo's
    # default dtolnay@stable setup is 1.88, too old for the pinned proof-systems).
    # The `toolchain` input takes the bare "1.92" channel — the same string the
    # crate's rust-toolchain.toml carries — so rustup resolves the latest 1.92.x.
    - name: Setup Rust 1.92 (the fixture-dump crate's pinned toolchain)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.92"

    - name: Cache fixture-dump cargo build
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          tools/fixture-dump/target/
        key: ${{ runner.os }}-fixture-dump-${{ hashFiles('tools/fixture-dump/Cargo.lock', 'tools/fixture-dump/rust-toolchain.toml') }}

    - name: Build the fixture-dump crate (all binaries)
      run: cargo build
      working-directory: tools/fixture-dump

  # ---- the CS-equality corpus (Lean) -----------------------------------
  # Lives here (not lean.yml) because it consumes the artifact from
  # test-circuit-diffs — `needs:`/artifacts only span a single workflow. On a
  # build-cache hit this is a few minutes; it only rebuilds the library when
  # `formal/` changed (in parallel with lean.yml doing the same).
  check-cs:
    if: github.event_name != 'workflow_dispatch'
    needs: test-circuit-diffs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Skip the large `mina` submodule; the Lean dependencies (CompElliptic,
        # Mathlib) are lake git requires, fetched by setup-lean.
        submodules: false

    - name: Setup Lean + build the library
      uses: ./.github/actions/setup-lean

    - name: Download the comparison dumps
      uses: actions/download-artifact@v4
      with:
        name: circuit-diff-results
        path: packages/pickles-circuit-diffs/circuits/results/

    # The CS-equality corpus: the kimchi backend's assembled constraint systems
    # replay byte-equal against this commit's own exports. This workflow has no
    # path filter, so every PR — PS-side or formal-side — is gated here.
    # A WORKSPACE script (formal/scripts/), not a package one: the corpus spans
    # packages, the linearization circuit coming from pickles and the gadgets from
    # snarky, so no single package can import every circuit under comparison.
    #
    # Run the COMPILED `check-cs` exe (the lean.yml build job pre-built it into the shared
    # cache): the interpreted corpus is ~35-57 min, the compiled one seconds. On a cache
    # hit `lake exe check-cs` is a no-op build + run; on a partial restore it recompiles
    # only what changed, then runs.
    - name: Check the kimchi CS-equality corpus
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd formal
        KIMCHI_PS_RESULTS_DIR=../packages/pickles-circuit-diffs/circuits/results \
          lake exe check-cs

  # ---- the theorems' suite on the prove tests' tag dumps (Lean) --------
  # Every tag the pickles prove tests compiled, rebuilt in Lean from its dump — the wrap
  # circuit at its constants, each branch's step circuit with the rule replayed from the
  # dump — against the systems the tests compiled, with the capstones' constant premises
  # and the cross-tag slot checks. Compiled by the lean.yml build job, like check-cs.
  check-tags:
    if: github.event_name != 'workflow_dispatch'
    needs: [test-libs, test-example]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Setup Lean + build the library
      uses: ./.github/actions/setup-lean

    - name: Download the tag dumps
      uses: actions/download-artifact@v4
      with:
        name: pickles-tag-dumps
        path: pickles-dumps/

    - name: Download the transaction circuit and application fixtures
      uses: actions/download-artifact@v4
      with:
        name: example-tag-dumps
        path: pickles-dumps/

    - name: Download the transaction proof cache
      uses: actions/download-artifact@v4
      with:
        name: example-proof-cache
        path: example-proof-cache/

    - name: Check per-slot chunk counts
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd formal
        PICKLES_DUMP_DIR=../pickles-dumps lake exe check-slot-chunks

    - name: Check application layouts and wiring against sidecars
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd formal
        lake build PicklesFixture.Application PicklesFixture.ApplicationImport
        PICKLES_DUMP_DIR=../pickles-dumps lake env lean --run scripts/check_application_layouts.lean

    # Application reconstruction derives its bases from the shared SRS. Link checks
    # additionally read committed proof caches and memoized verifier bases.
    - name: Cache SRS files
      uses: actions/cache@v3
      with:
        path: srs-cache/
        key: ${{ runner.os }}-srs-${{ hashFiles('mina/src/lib/crypto/proof-systems/srs/*.srs') }}

    - name: Populate SRS cache
      run: make fetch-srs

    - name: Check the tag dumps
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd formal
        PICKLES_DUMP_DIR=../pickles-dumps lake exe check-tags

    - name: Check rule replay and malformed application inputs
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd formal
        lake env lean --run scripts/check_application_manifest.lean
        lake exe check-rule-replay
        PICKLES_DUMP_DIR=../pickles-dumps lake exe check-application-inputs

    # One application's canonical compilations certified with their own kimchi indices, and
    # rejected at index data its keys could not have supplied; an explicit selection, never all.
    - name: Check one application's indices
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd formal
        PICKLES_DUMP_DIR=../pickles-dumps APPS=NoRecursionReturn lake exe check-application-indices

    # The certification executable on the same artifacts: reconstruct, compile once, check at
    # the keys' data, import the dumps' indices and certify them; no proof cache is read.
    - name: Derive keys for self, external and chunked application fixtures
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd formal
        PICKLES_DUMP_DIR=../pickles-dumps lake exe check-application-keys

    - name: Certify one application
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd formal
        PICKLES_DUMP_DIR=../pickles-dumps APPS=NoRecursionReturn lake exe certify-application
        PICKLES_DUMP_DIR=../pickles-dumps bash scripts/check_certify_failures.sh

    # Reconstructed applications invoke the verification and handover capstones directly:
    # Self recursion, base branches and a two-chunk imported source.
    - name: Check two apps' links
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd formal
        PICKLES_DUMP_DIR=../pickles-dumps LINKS=TwoPhaseChain,RecurseOverChunks lake exe check-tags

    # On main only: heterogeneous sources, partial padding and dynamic mustVerify.
    - name: Check additional applications' links
      if: github.event_name == 'push'
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd formal
        PICKLES_DUMP_DIR=../pickles-dumps \
          LINKS=HeterogeneousPrevs,SimpleChain,PaddedWideSlots lake exe check-tags

    - name: Check the transaction application's links
      if: github.event_name == 'push'
      run: |
        export PATH="$HOME/.elan/bin:$PATH"
        cd formal
        PICKLES_DUMP_DIR=../pickles-dumps PICKLES_PROOF_CACHE_DIR=../example-proof-cache \
          LINKS=ExampleTransaction lake exe check-tags

  # ---- build the example app for GitHub Pages -------------------------
  # The in-browser block-pipeline app: wasm kimchi backend + vite bundle,
  # base-pathed for the project page (/snarky/). Heavy (wasm + backend-es
  # build), so it runs only on the deploy paths (push to main, or a manual
  # workflow_dispatch preview of any branch); PRs still compile the app's
  # PureScript via the test-example job.

  build-pages:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest-large
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
          packages/kimchi-napi/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

    - name: Install dependencies
      run: npm install

    - name: Generate linearization code
      run: make gen-linearization

    - name: Build wasm kimchi backend
      run: npm run build:wasm -w kimchi-napi

    - name: Build the browser app (production, base /snarky/)
      run: npm run bundle -w example-app
      env:
        VITE_BASE: /snarky/
        NODE_OPTIONS: "--max-old-space-size=8192"

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: packages/example/app/web/dist

  # ---- synchronization point: deploy ---------------------------------
  # Two deploy paths:
  #   * push to main  -> deploy iff the FULL test suite + build-pages are green
  #     (the test jobs run on this event and must all succeed).
  #   * workflow_dispatch (any branch) -> the test jobs are skipped, so gate
  #     the preview deploy on build-pages alone.
  # always() lets this `if` evaluate even when the test jobs were skipped (the
  # dispatch path); on pull_request, build-pages is skipped so deploy is too.

  deploy:
    needs: [format-check, test-libs, test-example, test-circuit-diffs, build-pages]
    if: >-
      always() && needs.build-pages.result == 'success'
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && needs.format-check.result == 'success'
          && needs.test-libs.result == 'success'
          && needs.test-example.result == 'success'
          && needs.test-circuit-diffs.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
