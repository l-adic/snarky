<text x="190" y="42" class="panel" style="fill:#2164A6">F<tspan baseline-shift="sub" font-size="19">p</tspan></text>
<rect x="255" y="75" width="900" height="265" rx="8" class="step"/>
<rect x="310" y="170" width="250" height="95" rx="5" class="exported"/>
<text x="435" y="210" class="name" text-anchor="middle">Rule<tspan baseline-shift="sub" font-size="19">r</tspan></text>
<a xlink:href="https://github.com/l-adic/snarky/blob/main/formal/pickles/PicklesFixture/Rule.lean#L36"><text x="435" y="244" class="mono" text-anchor="middle">RuleDump shape r</text></a>
<rect x="685" y="160" width="420" height="110" rx="5" class="constructed"/>
<line x1="895" y1="175" x2="895" y2="255" stroke="#7BA787" stroke-width="1.5"/>
<text x="790" y="195" class="label" text-anchor="middle">Wrap group</text>
<text x="790" y="222" class="label" text-anchor="middle">verification</text>
<text x="790" y="249" class="small machinery-text" text-anchor="middle">slot Wrap proofs</text>
<text x="1000" y="195" class="label" text-anchor="middle">Step scalar</text>
<text x="1000" y="222" class="label" text-anchor="middle">finalization</text>
