<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1460" height="640" viewBox="0 0 1460 640" role="img" aria-labelledby="title desc">
<title id="title">Reconstructing Step and Wrap</title>
<desc id="desc">Blue marks the Step circuit's field Fp; orange marks the Wrap circuit's field Fq. Purple marks exported rule constraints; green marks reconstructed Pickles verification machinery. StepMainAdvice branches outside the Step boundary: publicInput of shape.inputType goes up and then right into the rule, while the remaining advice continues horizontally to the verification machinery. StepStatement includes a digest of the rule's input and output. Wrap takes advice and a packed WrapStatement as inputs and has no public output. Shape-indexed types follow the paper's schematic appendix.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#38434E"/></marker>
<style>
text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #202830; }
.panel { font-family: Georgia, "Times New Roman", serif; font-size: 28px; }
.label { font-size: 22px; }
.small { font-size: 18px; fill: #53606C; }
.mono { font-family: "DejaVu Sans Mono", Menlo, monospace; font-size: 19px; }
.name { font-family: "DejaVu Sans Mono", Menlo, monospace; font-size: 27px; }
.exported { fill: #F2EAF8; stroke: #764596; stroke-width: 1.8; }
.constructed { fill: #CEE8D3; stroke: #438155; stroke-width: 1.8; }
.label, .machinery-text { fill: #234A30; }
.step { fill: #FAFCFF; stroke: #2164A6; stroke-width: 2.4; }
.wrap { fill: #FFFCF8; stroke: #BD650B; stroke-width: 2.4; }
.wire { fill: none; stroke: #38434E; stroke-width: 2.3; stroke-linejoin: round; }
.bundle { fill: none; stroke: #38434E; stroke-width: 3.6; stroke-linejoin: round; }
.port { fill: #FFFFFF; stroke: #38434E; stroke-width: 1.6; }
a { cursor: pointer; }
</style>
</defs>
<rect width="1460" height="640" fill="#FFFFFF"/>
