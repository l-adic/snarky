<text x="510" y="488" class="label" text-anchor="middle">Step group verification</text>
<text x="510" y="523" class="small machinery-text" text-anchor="middle">current Step<tspan baseline-shift="sub" font-size="13">r</tspan> proof</text>
<rect x="755" y="453" width="350" height="110" rx="5" class="constructed"/>
<text x="930" y="488" class="label" text-anchor="middle">Wrap scalar finalization</text>
